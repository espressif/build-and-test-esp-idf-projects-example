name: "Build and Test Examples - Modify cmp1"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build_action_branch:
        description: 'Branch of espressif/build-esp-idf-projects-action to use'
        required: true
        default: 'v1'
        type: string
      test_action_branch:
        description: 'Branch of espressif/test-esp-idf-projects-action to use'
        required: true
        default: 'v1'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-examples-modify-cmp1:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.4
    steps:
      - uses: espressif/build-esp-idf-projects-action@${{ inputs.build_action_branch }}
        id: build
        with:
          paths: "examples;examples/test-cmp1"
          target: esp32
          modified_files: "components/cmp1/cmp1.c;"
          artifact_name: app_binaries_modify_cmp1
      - uses: actions/download-artifact@v4
      - name: check cmp2 project skipped
        run: |
          apt update && apt install -y jq
          [ "$(grep -c '^{' app_info_1.txt)" -eq 3 ]
          [ "$(grep 'test-cmp1"' app_info_1.txt | jq -r .build_status)" = "build success" ]
          [ "$(grep 'test-cmp1-cmp2"' app_info_1.txt | jq -r .build_status)" = "build success" ]
          [ "$(grep 'test-cmp2"' app_info_1.txt | jq -r .build_status)" = "skipped" ]
    outputs:
      test_matrix_json: ${{ steps.build.outputs.test_matrix_json }}

  test-examples-modify-cmp1:
    needs: [build-examples-modify-cmp1]
    strategy:
      matrix: ${{ fromJSON(needs.build-examples-modify-cmp1.outputs.test_matrix_json) }}
      fail-fast: false
    runs-on: ${{ matrix.runner_tags }}
    container:
      image: python:3
      options: --privileged
    steps:
      - uses: espressif/test-esp-idf-projects-action@${{ inputs.test_action_branch }}
        with:
          nodes: ${{ matrix.nodes }}
          junit_filepath: report-${{ matrix.targets }}-${{ matrix.env_markers }}.xml
